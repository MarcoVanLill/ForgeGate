name: Integration tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -tags=integration -v -timeout=10m ./tests/integration
