apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "forgegate.fullname" . }}-gateway
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "forgegate.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "forgegate.fullname" . }}-worker
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "forgegate.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
{{- if .Values.gateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "forgegate.fullname" . }}-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "forgegate.fullname" . }}-gateway}
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "forgegate.fullname" . }}-worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "forgegate.fullname" . }}-worker}
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
