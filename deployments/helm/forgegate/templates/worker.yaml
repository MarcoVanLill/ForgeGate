apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forgegate.fullname" . }}-worker
  labels:
    {{- include "forgegate.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "forgegate.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
      labels:
        {{- include "forgegate.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "forgegate.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}-worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "forgegate.fullname" . }}}
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: FORGEGATE_WORKER_METRICS_ADDR, value: ":{{ .Values.worker.metricsPort }}"}
          ports:
            - {name: metrics, containerPort: {{ .Values.worker.metricsPort }}, protocol: TCP}
          livenessProbe: {httpGet: {path: /health/live, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health/live, port: metrics}, initialDelaySeconds: 5, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgegate.fullname" . }}-worker
  labels:
    {{- include "forgegate.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "forgegate.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    - {name: metrics, port: {{ .Values.worker.metricsPort }}, targetPort: metrics}
