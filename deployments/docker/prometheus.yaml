global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: forgegate-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: forgegate-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
